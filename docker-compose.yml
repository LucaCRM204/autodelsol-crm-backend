version: '3.8'
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: autodelsol_crm
      MYSQL_USER: autodelsol_app
      MYSQL_PASSWORD: change_this_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: .
    ports:
      - "3001:3001"
    environment:
      DB_HOST: mysql
      DB_USER: autodelsol_app
      DB_PASSWORD: change_this_password
      DB_NAME: autodelsol_crm
      JWT_SECRET: change_this_jwt_secret
    depends_on:
      - mysql

volumes:
  mysql_data:
